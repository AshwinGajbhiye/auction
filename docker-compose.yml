version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: campusloop_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusloop_dev}
      POSTGRES_DB: ${POSTGRES_DB:-campusloop}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-campusloop}']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: campusloop_db_test
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusloop_test
      POSTGRES_PASSWORD: campusloop_test
      POSTGRES_DB: campusloop_test
    ports:
      - '5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U campusloop_test']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_test_data:
